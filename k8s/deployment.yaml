apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-java-cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jenkins-java-cicd
  template:
    metadata:
      labels:
        app: jenkins-java-cicd
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-java-cicd
spec:
  type: ClusterIP
  selector:
    app: jenkins-java-cicd
  ports:
    - port: 8080
      targetPort: 8080
